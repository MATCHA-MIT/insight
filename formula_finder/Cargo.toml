[package]
name = "invariant_finder_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "invariant_finder_rust"

crate-type =  ["rlib", "cdylib"]

[dependencies]
fstapi = "*" 
itertools = "*"
indicatif = {version = "*", features = ["rayon"]}
rayon = "1.10.0"
regex = "1.11.1"
serde = {version = "*", features = ["derive", "rc"] }
serde_json = "1.0.138"
vcd = {path = "rust_vcd/"}
# z3 = {version = "*", features = ["static-link-z3"]}
# z3-sys = {version = "*", features = ["static-link-z3"]}
clap = { version = "*", features = ["derive"] }
clap_complete = "*"
grb = {version= "3.0.1",features = ['gurobi12'], optional = true}
once_cell = "1.21.3"
bimap = "0.6.3"
# jemallocator = "0.5.4"
nohash = "0.2.0"
ustr = "1.1.0"
deepsize = "0.2.0"
hibitset = "0.6.4"
chrono = "0.4.41"
rand = "*"
dashmap = {version="6.1.0", features= ["rayon"]}
rustc-hash = "2.1.1"
wellen = {path = "wellen/wellen/"}
fst-reader = "0.14.0"
log = "*"
env_logger = "*"

[dependencies.uuid]
version = "1.15.1"
# Lets you generate random UUIDs
features = [
    "v4",
]

[features]
default = ["grb"]
ilp = ["grb"]

[profile.release]
debug = 1
# rustflags = ["-C", "force-frame-pointers=yes"]
